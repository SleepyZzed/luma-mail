      - name: Native bounded long-conversation reading
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export LUMA_ENGINE="$(cygpath -m "$PWD")/target/debug/luma-engine.exe"
          export LUMA_THREAD_REPORT="$(cygpath -m "$PWD")/fluid-thread-windows.json"
          export LUMA_PREVIEW_THREAD_COUNT=2503
          export QT_FORCE_STDERR_LOGGING=1
          timeout 35s build-fluid/luma-mail-fluid.exe --design-preview --thread-test >thread.stdout 2>thread.stderr
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fluid-thread-windows
          path: |
            fluid-thread-windows.json
            thread.stderr
          if-no-files-found: warn
      - name: Native online signature editing and close policies
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export LUMA_ENGINE="$(cygpath -m "$PWD")/target/debug/luma-engine.exe"
          export LUMA_SIGNATURE_REPORT="$(cygpath -m "$PWD")/fluid-signature-windows.json"
          export QT_FORCE_STDERR_LOGGING=1
          timeout 35s build-fluid/luma-mail-fluid.exe --design-preview --signature-test >signature.stdout 2>signature.stderr
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fluid-signature-windows
          path: |
            fluid-signature-windows.json
            signature.stderr
          if-no-files-found: warn
      - name: Complete synthetic process-tree resource audit
        shell: pwsh
        env:
          LUMA_ENGINE: ${{ github.workspace }}/target/debug/luma-engine.exe
          LUMA_WEBVIEW: ${{ github.workspace }}/target/debug/luma_webview.dll
          QT_FORCE_STDERR_LOGGING: '1'
        run: |
          $env:PATH=$env:LUMA_QT_BIN+";"+$env:PATH
          ./packaging/test-windows-performance.ps1 -Fluid -Binary ./build-fluid/luma-mail-fluid.exe -Evidence ./fluid-resource-windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fluid-resource-windows
          path: fluid-resource-windows
          if-no-files-found: warn

      - name: Build registered fluid preview engine and HTML adapter
        if: github.event_name != 'pull_request'
        shell: msys2 {0}
        env:
          LUMA_GOOGLE_CLIENT_ID: ${{ secrets.LUMA_GOOGLE_CLIENT_ID }}
          LUMA_GOOGLE_CLIENT_SECRET: ${{ secrets.LUMA_GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          cargo build --locked --release -p luma-engine --features require-google-client
          cargo build --locked --release -p luma-webview
          python packaging/webview2-loader.py --binary target/release/luma-engine.exe
      - name: Build GTK-free Windows portable package
        if: github.event_name != 'pull_request'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          python packaging/fluid-windows.py --prefix /ucrt64 --binary build-fluid/luma-mail-fluid.exe --engine target/release/luma-engine.exe --webview target/release/luma_webview.dll --output dist-fluid/Luma-Mail-Fluid --version "0.10.0-preview.${GITHUB_SHA:0:7}"
      - name: Test portable Windows package without SDK paths
        if: github.event_name != 'pull_request'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          python packaging/test-fluid-package.py --binary dist-fluid/Luma-Mail-Fluid/bin/luma-mail.exe --output fluid-package-windows
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        with:
          name: fluid-preview-windows
          path: |
            dist-fluid/*.zip
            dist-fluid/*.sha256
            dist-fluid/*.storage.json
            fluid-package-windows
          if-no-files-found: warn
