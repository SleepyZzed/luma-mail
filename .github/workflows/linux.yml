name: Linux build and AppImage
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a development prerelease after all checks pass
        type: boolean
        default: false
      tag:
        description: New release tag
        type: string
        default: v0.1.0-dev.1
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Native libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libdbus-1-dev pkg-config xvfb dbus-x11 librsvg2-dev gobject-introspection libgirepository1.0-dev patchelf file desktop-file-utils adwaita-icon-theme curl python3-dbus python3-gi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Tray and system notification D-Bus acceptance
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 packaging/test-desktop.py
      - run: cargo build --locked --release
      - name: Native GTK launch
        run: dbus-run-session -- xvfb-run -a target/release/luma-mail --smoke-test
      - name: Package AppImage
        run: bash packaging/appimage.sh
      - name: Launch bundled AppImage
        run: dbus-run-session -- xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 dist/Luma-Mail-0.1.0-x86_64.AppImage --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: luma-mail-linux-x86_64
          path: dist/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: luma-mail-linux-x86_64
          path: dist
      - name: Publish checked development build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]]
          gh release create "$RELEASE_TAG" dist/* --target "$RELEASE_COMMIT" --title "Luma Mail $RELEASE_TAG (development preview)" --notes-file docs/release-notes.md --prerelease
