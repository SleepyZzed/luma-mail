[package]
name = "luma-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
require-google-client = []

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
directories = "6"
encoding_rs = "0.8"
html2text = "0.17"
html5ever = "0.40"
ammonia = "4.2"
linkify = "0.10"
csscolorparser = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
roxmltree = "0.21"
zip = { version = "9", default-features = false, features = ["deflate"] }
oauth2 = { version = "5", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query", "form", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
subtle = "2"
thiserror = "2"
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { workspace = true, features = ["test-util"] }
mailparse = "0.18.0"
